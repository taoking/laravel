openapi: 3.1.0
info:
  title: Laravel 13 资深 PHP 学习项目 API
  version: 0.4.0
  description: |
    多数据源指标分析与内容管理平台的 API 契约。
    本文档用于本地开发、接口联调、面试演示和后续 Codex agent 开发校验。
    默认鉴权方式是 Laravel Web Session Cookie；签名接口单独使用 HMAC 请求头。
servers:
  - url: http://127.0.0.1:8000
    description: 本地 artisan server
tags:
  - name: Auth
    description: 登录、退出和 Web Session 鉴权
  - name: System
    description: 健康检查和运行状态
  - name: Access
    description: 当前用户、权限、菜单、用户和角色管理
  - name: Metrics
    description: 指标库、指标分类、地区和频率维度
  - name: Async
    description: 导入、导出、队列任务和异步处理
  - name: Security
    description: 签名、反重放、限流和审计日志
security:
  - sessionCookie: []
paths:
  /login:
    post:
      tags: [Auth]
      summary: 用户登录
      description: 使用 Laravel Web Session Guard 登录后台。JSON 请求返回统一响应，浏览器表单登录成功后跳转到后台首页。
      operationId: postLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserEnvelope'
        '302':
          description: 浏览器表单登录成功后跳转到 `/admin`
        '422':
          $ref: '#/components/responses/ValidationError'
  /logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: 注销当前 Web Session，并重新生成 CSRF Token。JSON 请求返回成功响应，浏览器请求跳转到登录页。
      operationId: postLogout
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '302':
          description: 浏览器退出后跳转到 `/login`
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/health:
    get:
      tags: [System]
      summary: API 健康检查
      description: 不需要登录，用于本地启动、Docker 健康检查和部署验收。
      operationId: getApiHealth
      security: []
      responses:
        '200':
          description: API 服务可用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Health'
  /api/v1/security/signed-echo:
    post:
      tags: [Security]
      summary: 签名反重放校验示例
      description: 使用 `X-Timestamp`、`X-Nonce` 和 `X-Signature` 校验 HMAC 签名；同一 nonce 重放会返回冲突错误。
      operationId: postSignedEcho
      security: []
      parameters:
        - in: header
          name: X-Timestamp
          required: true
          description: Unix 秒级时间戳，默认有效窗口 5 分钟
          schema:
            type: string
          example: '1760000000'
        - in: header
          name: X-Nonce
          required: true
          description: 每次请求唯一随机串，用于反重放
          schema:
            type: string
          example: nonce-20260515-0001
        - in: header
          name: X-Signature
          required: true
          description: HMAC SHA256 签名结果
          schema:
            type: string
          example: 64位十六进制签名
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              echo:
                summary: 签名请求体示例
                value:
                  message: ping
                  metric_id: 1
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/security/url-check:
    post:
      tags: [Security]
      summary: SSRF URL 安全检查
      description: 登录管理员用于验证远程数据源或 Webhook URL 是否安全。示例会阻断 localhost、私有网段、保留地址、带账号密码的 URL 和非标准端口。
      operationId: postSecurityUrlCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: https://93.184.216.34/report.csv
      responses:
        '200':
          description: URL 可以作为远程资源访问目标
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                            example: true
                          url:
                            type: string
                          host:
                            type: string
                          resolved_ips:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      tags: [Access]
      summary: 获取当前登录用户
      description: 返回当前 Session 用户、角色摘要和基础状态，用于后台初始化。
      operationId: getMe
      responses:
        '200':
          $ref: '#/components/responses/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/permissions:
    get:
      tags: [Access]
      summary: 获取当前权限和菜单
      description: 返回当前用户拥有的权限编码和可见菜单树，前端用于导航、按钮权限和页面守卫。
      operationId: getCurrentPermissions
      responses:
        '200':
          description: 当前用户权限和菜单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [permissions, menus]
                        properties:
                          permissions:
                            type: array
                            items:
                              type: string
                            example: ['*']
                          menus:
                            type: array
                            items:
                              $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/permissions/catalog:
    get:
      tags: [Access]
      summary: 获取权限和菜单目录
      description: 管理员维护角色权限时使用，返回系统权限点和菜单目录。
      operationId: getPermissionCatalog
      responses:
        '200':
          description: 权限和菜单目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [permissions, menus]
                        properties:
                          permissions:
                            type: array
                            items:
                              $ref: '#/components/schemas/Permission'
                          menus:
                            type: array
                            items:
                              $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      tags: [Access]
      summary: 用户列表
      description: 支持关键字、状态和分页筛选；需要用户查看权限。
      operationId: getUsers
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, disabled]
        - in: query
          name: per_page
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Access]
      summary: 创建用户
      description: 创建后台用户并同步角色。成功后会清理该用户权限缓存。
      operationId: postUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/users/{user}:
    get:
      tags: [Access]
      summary: 用户详情
      description: 查看指定用户和角色信息；Policy 会控制是否允许访问。
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: [Access]
      summary: 更新用户
      description: 更新用户资料、状态、密码或角色，并刷新权限缓存。
      operationId: putUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Access]
      summary: 删除用户
      description: 删除用户前会解除角色关系，并清理权限缓存。
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/roles:
    get:
      tags: [Access]
      summary: 角色列表
      description: 返回角色及其权限，用于角色管理页面。
      operationId: getRoles
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Access]
      summary: 创建角色
      description: 创建角色并可同时绑定权限。
      operationId: postRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/RoleEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/roles/{role}:
    put:
      tags: [Access]
      summary: 更新角色
      description: 更新非系统角色的名称、编码、数据范围和描述。
      operationId: putRole
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/RoleEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Access]
      summary: 删除角色
      description: 删除非系统角色，并解除用户和权限关系。
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/roles/{role}/permissions:
    put:
      tags: [Access]
      summary: 替换角色权限
      description: 全量替换角色权限，并刷新受影响用户的权限缓存。超级管理员角色不可修改。
      operationId: putRolePermissions
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  items:
                    type: integer
              example:
                permission_ids: [1, 2, 3]
      responses:
        '200':
          $ref: '#/components/responses/RoleEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/menus/{menu}:
    put:
      tags: [Access]
      summary: 更新菜单
      description: 更新菜单标题、路径、排序和可见状态。
      operationId: putMenu
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                path:
                  type: string
                sort_order:
                  type: integer
                is_visible:
                  type: boolean
              example:
                title: 指标管理
                path: /admin/metrics
                sort_order: 30
                is_visible: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/metrics:
    get:
      tags: [Metrics]
      summary: 指标列表
      description: 支持关键字、状态、分类、地区、频率、日期、排序和分页筛选；排序字段由后端白名单控制。
      operationId: getMetrics
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: category_code
          schema:
            type: string
        - in: query
          name: region_id
          schema:
            type: integer
        - in: query
          name: frequency_code
          schema:
            type: string
        - in: query
          name: date_from
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
        - in: query
          name: sort
          schema:
            type: string
            enum: [id, name, code, status, created_at, updated_at]
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: per_page
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 指标分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Metric'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/Error'
    post:
      tags: [Metrics]
      summary: 创建指标
      description: 创建指标并发布 `metric.data.changed` 事件，同时记录审计日志。
      operationId: postMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/MetricEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/metrics/{metric}:
    get:
      tags: [Metrics]
      summary: 指标详情
      description: 返回指标详情和最新值，同时记录热点指标访问并使用指标详情缓存。
      operationId: getMetric
      parameters:
        - $ref: '#/components/parameters/MetricId'
      responses:
        '200':
          $ref: '#/components/responses/MetricEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: [Metrics]
      summary: 更新指标
      description: 更新指标后会清理指标详情缓存，发布 Kafka 事件并记录审计日志。
      operationId: putMetric
      parameters:
        - $ref: '#/components/parameters/MetricId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/MetricEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Metrics]
      summary: 删除指标
      description: 软删除指标，清理缓存，发布事件并记录审计日志。
      operationId: deleteMetric
      parameters:
        - $ref: '#/components/parameters/MetricId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/metric-categories:
    get:
      tags: [Metrics]
      summary: 指标分类列表
      description: 返回启用状态的指标分类，用于筛选和创建指标。
      operationId: getMetricCategories
      responses:
        '200':
          description: 指标分类列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MetricCategory'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/dimensions/regions:
    get:
      tags: [Metrics]
      summary: 地区维度列表
      description: 返回启用状态的地区维度。
      operationId: getRegions
      responses:
        '200':
          description: 地区列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Region'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/dimensions/frequencies:
    get:
      tags: [Metrics]
      summary: 频率维度列表
      description: 返回启用状态的频率维度。
      operationId: getFrequencies
      responses:
        '200':
          description: 频率列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Frequency'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/imports:
    get:
      tags: [Async]
      summary: 导入任务列表
      description: 返回 CSV 导入任务、状态、行数统计、失败分类和补偿信息。
      operationId: getImports
      responses:
        '200':
          description: 导入任务分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ImportTask'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Async]
      summary: 创建 CSV 导入任务
      description: 上传 CSV/TXT 文件并创建异步导入任务。支持 `Idempotency-Key`，重复提交会返回已有任务。
      operationId: postImports
      parameters:
        - in: header
          name: Idempotency-Key
          description: 幂等键；重复提交同一键返回已有导入任务
          schema:
            type: string
          example: import-20260515-0001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                idempotency_key:
                  type: string
            encoding:
              file:
                contentType: text/csv
      responses:
        '202':
          $ref: '#/components/responses/ImportTaskEnvelope'
        '200':
          $ref: '#/components/responses/ImportTaskEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/imports/{import}:
    get:
      tags: [Async]
      summary: 导入任务详情
      description: 查看导入任务状态、统计和失败明细。
      operationId: getImport
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          $ref: '#/components/responses/ImportTaskEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/imports/{import}/retry:
    post:
      tags: [Async]
      summary: 重试导入任务
      description: 清理旧失败记录，将任务重置为 pending 并重新派发导入 Job。
      operationId: postImportRetry
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          $ref: '#/components/responses/ImportTaskEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/exports:
    post:
      tags: [Async]
      summary: 创建导出任务
      description: 创建异步导出任务。支持 `Idempotency-Key`，重复提交返回已有导出任务。
      operationId: postExports
      parameters:
        - in: header
          name: Idempotency-Key
          description: 幂等键；重复提交同一键返回已有导出任务
          schema:
            type: string
          example: export-20260515-0001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [metrics]
                filters:
                  type: object
                  additionalProperties: true
              example:
                type: metrics
                filters:
                  status: active
                  category_code: finance
      responses:
        '202':
          $ref: '#/components/responses/ExportTaskEnvelope'
        '200':
          $ref: '#/components/responses/ExportTaskEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/audit-logs:
    get:
      tags: [Security]
      summary: 审计日志列表
      description: 管理员查看操作审计日志，支持按动作、用户和分页筛选，并返回 `trace_id` 方便排查。
      operationId: getAuditLogs
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: user_id
          schema:
            type: integer
        - in: query
          name: per_page
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 审计日志分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel-session
  parameters:
    UserId:
      in: path
      name: user
      description: 用户 ID
      required: true
      schema:
        type: integer
      example: 1
    RoleId:
      in: path
      name: role
      description: 角色 ID
      required: true
      schema:
        type: integer
      example: 1
    MenuId:
      in: path
      name: menu
      description: 菜单 ID
      required: true
      schema:
        type: integer
      example: 1
    MetricId:
      in: path
      name: metric
      description: 指标 ID
      required: true
      schema:
        type: integer
      example: 1
    ImportId:
      in: path
      name: import
      description: 导入任务 ID
      required: true
      schema:
        type: integer
      example: 1
  responses:
    Success:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccess'
    UserEnvelope:
      description: 用户响应 envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
    RoleEnvelope:
      description: 角色响应 envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    type: object
                    required: [role]
                    properties:
                      role:
                        $ref: '#/components/schemas/Role'
    MetricEnvelope:
      description: 指标响应 envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    type: object
                    required: [metric]
                    properties:
                      metric:
                        $ref: '#/components/schemas/Metric'
    ImportTaskEnvelope:
      description: 导入任务响应 envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    type: object
                    required: [import_task]
                    properties:
                      import_task:
                        $ref: '#/components/schemas/ImportTask'
    ExportTaskEnvelope:
      description: 导出任务响应 envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    type: object
                    required: [export_task]
                    properties:
                      export_task:
                        $ref: '#/components/schemas/ExportTask'
    Error:
      description: 通用错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unauthenticated:
              summary: 未登录
              value:
                success: false
                message: Unauthenticated.
                errors: {}
                trace_id: 0196f0f1-0000-7000-8000-000000000000
            forbidden:
              summary: 无权限
              value:
                success: false
                message: Forbidden.
                errors: {}
                trace_id: 0196f0f1-0000-7000-8000-000000000000
            not_found:
              summary: 资源不存在
              value:
                success: false
                message: Not Found.
                errors: {}
                trace_id: 0196f0f1-0000-7000-8000-000000000000
            rate_limited:
              summary: 请求过于频繁
              value:
                success: false
                message: Too Many Attempts.
                errors: {}
                trace_id: 0196f0f1-0000-7000-8000-000000000000
    ValidationError:
      description: 参数验证失败响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation_failed:
              summary: 字段验证失败
              value:
                success: false
                message: The given data was invalid.
                errors:
                  email:
                    - The email field is required.
                trace_id: 0196f0f1-0000-7000-8000-000000000000
  schemas:
    ApiSuccess:
      type: object
      required: [success, message, data, trace_id]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          type: object
        trace_id:
          type: [string, 'null']
          example: 0196f0f1-0000-7000-8000-000000000000
    ApiError:
      type: object
      required: [success, message, errors, trace_id]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Forbidden.
        errors:
          type: object
          additionalProperties: true
        trace_id:
          type: [string, 'null']
    Health:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: metrics-platform-api
        version:
          type: string
          example: v1
        timestamp:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      example:
        email: admin@example.com
        password: password
        remember: true
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: password
        remember:
          type: boolean
          default: false
    UserUpsertRequest:
      type: object
      example:
        name: Analyst User
        email: analyst@example.com
        password: password
        status: active
        role_ids: [2]
      properties:
        name:
          type: string
          example: Analyst User
        email:
          type: string
          format: email
          example: analyst@example.com
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum: [active, disabled]
        role_ids:
          type: array
          items:
            type: integer
    RoleUpsertRequest:
      type: object
      example:
        name: Analyst
        code: analyst
        data_scope: self
        description: 指标分析师
        permission_ids: [1, 2, 3]
      properties:
        name:
          type: string
          example: Analyst
        code:
          type: string
          example: analyst
        data_scope:
          type: string
          enum: [all, department, self]
        description:
          type: string
        permission_ids:
          type: array
          items:
            type: integer
    User:
      type: object
      required: [id, name, email, status]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        last_login_at:
          type: [string, 'null']
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    RoleSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        data_scope:
          type: string
    Role:
      allOf:
        - $ref: '#/components/schemas/RoleSummary'
        - type: object
          properties:
            description:
              type: [string, 'null']
            is_system:
              type: boolean
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/Permission'
            created_at:
              type: [string, 'null']
              format: date-time
            updated_at:
              type: [string, 'null']
              format: date-time
    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [menu, button, api]
    Menu:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        path:
          type: string
        route_name:
          type: [string, 'null']
        icon:
          type: [string, 'null']
        permission:
          type: [string, 'null']
        children:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
    MetricUpsertRequest:
      type: object
      required: [metric_category_id, name, code]
      example:
        metric_category_id: 1
        name: Revenue Amount
        code: revenue_amount
        unit: CNY
        status: active
        description: 月度收入金额
        sort_order: 10
      properties:
        metric_category_id:
          type: integer
        name:
          type: string
          example: Revenue Amount
        code:
          type: string
          example: revenue_amount
        unit:
          type: [string, 'null']
          example: CNY
        status:
          type: string
          enum: [active, disabled]
        description:
          type: [string, 'null']
        sort_order:
          type: integer
    Metric:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        unit:
          type: [string, 'null']
        status:
          type: string
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/MetricCategory'
        latest_value:
          type: [object, 'null']
          properties:
            id:
              type: integer
            value:
              type: string
            period_date:
              type: string
              format: date
            period_label:
              type: string
            region:
              $ref: '#/components/schemas/Region'
            frequency:
              $ref: '#/components/schemas/Frequency'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    MetricCategory:
      type: object
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, 'null']
        name:
          type: string
        code:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
        is_active:
          type: boolean
    Region:
      type: object
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, 'null']
        name:
          type: string
        code:
          type: string
        level:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
    Frequency:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
    ImportTask:
      type: object
      properties:
        id:
          type: integer
        idempotency_key:
          type: string
        original_name:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, completed_with_errors, failed]
        total_rows:
          type: integer
        success_rows:
          type: integer
        failed_rows:
          type: integer
        attempts:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              row_number:
                type: integer
              payload:
                type: object
              errors:
                type: object
        error_message:
          type: [string, 'null']
        failure_type:
          type: [string, 'null']
          enum: [storage, data_format, unexpected, null]
        last_failed_at:
          type: [string, 'null']
          format: date-time
        compensated_at:
          type: [string, 'null']
          format: date-time
        compensation_reason:
          type: [string, 'null']
    ExportTask:
      type: object
      properties:
        id:
          type: integer
        idempotency_key:
          type: string
        type:
          type: string
        status:
          type: string
        filters:
          type: object
        path:
          type: [string, 'null']
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: [integer, 'null']
        action:
          type: string
        resource_type:
          type: [string, 'null']
        resource_id:
          type: [integer, 'null']
        ip_address:
          type: [string, 'null']
        trace_id:
          type: [string, 'null']
        metadata:
          type: [object, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
    PaginationMeta:
      type: object
      required: [current_page, per_page, total]
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
