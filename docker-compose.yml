x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-bi_platform}
  DB_USERNAME: ${DB_USERNAME:-bi_user}
  DB_PASSWORD: ${DB_PASSWORD:-bi_password}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-bi-platform}
  MINIO_USE_PATH_STYLE_ENDPOINT: true
  BI_ACCELERATION_ENABLED: ${BI_ACCELERATION_ENABLED:-true}
  BI_ACCELERATION_ENGINE: ${BI_ACCELERATION_ENGINE:-clickhouse}
  BI_CLICKHOUSE_HOST: ${BI_CLICKHOUSE_HOST:-clickhouse}
  BI_CLICKHOUSE_PORT: ${BI_CLICKHOUSE_PORT:-8123}
  BI_CLICKHOUSE_DATABASE: ${BI_CLICKHOUSE_DATABASE:-bi_accelerator}
  BI_CLICKHOUSE_USERNAME: ${BI_CLICKHOUSE_USERNAME:-default}
  BI_CLICKHOUSE_PASSWORD: ${BI_CLICKHOUSE_PASSWORD:-}
  BI_AGGREGATE_ACCELERATION_ENABLED: ${BI_AGGREGATE_ACCELERATION_ENABLED:-true}
  BI_AGGREGATE_MAX_DIMENSIONS: ${BI_AGGREGATE_MAX_DIMENSIONS:-5}
  BI_AGGREGATE_MAX_METRICS: ${BI_AGGREGATE_MAX_METRICS:-10}
  BI_ACCELERATION_RECOMMENDATION_ENABLED: ${BI_ACCELERATION_RECOMMENDATION_ENABLED:-true}
  BI_ACCELERATION_ANALYSIS_DAYS: ${BI_ACCELERATION_ANALYSIS_DAYS:-7}
  BI_ACCELERATION_RECOMMEND_SLOW_MS: ${BI_ACCELERATION_RECOMMEND_SLOW_MS:-3000}
  BI_ACCELERATION_RECOMMEND_MIN_QUERY_COUNT: ${BI_ACCELERATION_RECOMMEND_MIN_QUERY_COUNT:-5}
  BI_ACCELERATION_RECOMMEND_HIGH_FREQUENCY: ${BI_ACCELERATION_RECOMMEND_HIGH_FREQUENCY:-30}
  BI_ACCELERATION_RECOMMEND_MAX_DIMENSIONS: ${BI_ACCELERATION_RECOMMEND_MAX_DIMENSIONS:-5}
  BI_ACCELERATION_RECOMMEND_MAX_METRICS: ${BI_ACCELERATION_RECOMMEND_MAX_METRICS:-10}
  BI_ACCELERATION_REFRESH_ENABLED: ${BI_ACCELERATION_REFRESH_ENABLED:-true}
  BI_ACCELERATION_REFRESH_INTERVAL_MINUTES: ${BI_ACCELERATION_REFRESH_INTERVAL_MINUTES:-5}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *app-environment
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-bi-platform.ini:ro
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bi_platform}
      MYSQL_USER: ${DB_USERNAME:-bi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bi_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "${BI_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${BI_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${BI_CLICKHOUSE_DATABASE:-bi_accelerator}
      CLICKHOUSE_USER: ${BI_CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${BI_CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --tries=3 --sleep=3 --timeout=90
    environment:
      <<: *app-environment
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-bi-platform.ini:ro
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    environment:
      <<: *app-environment
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-bi-platform.ini:ro
    depends_on:
      - mysql
      - redis

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html

volumes:
  mysql-data:
  redis-data:
  minio-data:
  clickhouse-data:
